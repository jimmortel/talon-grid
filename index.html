<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALON Grid</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
        .info-box { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; max-width: 500px; margin: 0 auto 20px auto; }
        .address { font-family: monospace; font-size: 12px; color: #555; word-break: break-all; background: #eee; padding: 5px; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 4px; 
            max-width: 500px; 
            margin: 0 auto; 
        }
        .cell { 
            border: 1px solid #ccc; 
            background: white; 
            padding: 8px 0; 
            font-size: 10px; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 25px;
        }
        .taken { background: #e0f7fa; color: #006064; font-weight: bold; }
    </style>
</head>
<body>
    <h1>TALON Grid</h1>
    
    <div class="info-box">
        <p><strong>Official Address:</strong></p>
        <p class="address">0x872bD846596Cc1aEde8Fd800997d242e3473fA83</p>
        <p><small>Send ETH to this address to claim your spot on the grid.</small></p>
    </div>

    <div id="grid" class="grid"></div>

    <script>
        const grid = document.getElementById('grid');
        // Liste des cases occupées
        const occupants = {
            1: "Player A", 
            12: "Player B"
        };

        for (let i = 1; i <= 100; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell' + (occupants[i] ? ' taken' : '');
            cell.innerText = occupants[i] || i;
            grid.appendChild(cell);
        }
    </script>
</body>
</html>
