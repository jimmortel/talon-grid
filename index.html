<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALON Grid</title>
    <style>
        body { background: #0a0e17; color: #d4af37; font-family: 'Arial', sans-serif; text-align: center; padding: 20px; }
        .main-container { background: #1a1a1a; border: 2px solid #d4af37; padding: 20px; border-radius: 15px; max-width: 450px; margin: 0 auto; }
        h1 { color: #d4af37; text-transform: uppercase; margin-bottom: 10px; }
        
        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; margin-top: 20px; }
        .cell { 
            background: #000; 
            border: 1px solid #d4af37; 
            color: #fff; 
            height: 30px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 8px; /* Taille optimisée pour les pseudos */
            overflow: hidden; /* Empêche le texte de dépasser */
            white-space: nowrap;
            text-overflow: ellipsis;
            padding: 0 2px;
        }
        .taken { background: #d4af37; color: #000; font-weight: bold; }
        .prize-box { margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>TALON Grid</h1>
        <div class="prize-box">
            <p>1st: 10k TALON | 2nd: 5k | 3rd: 2k</p>
        </div>
        <div id="grid" class="grid"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        
        // Liste des cases occupées (Vide pour le lancement)
        const occupants = {}; 

        for (let i = 1; i <= 100; i++) {
            const cell = document.createElement('div');
            // Si la case existe dans 'occupants', on applique le style .taken
            cell.className = 'cell' + (occupants[i] ? ' taken' : '');
            // Si le nom existe, on l'affiche, sinon on affiche le numéro
            cell.innerText = occupants[i] || i;
            grid.appendChild(cell);
        }
    </script>
</body>
</html>
