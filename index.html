<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALON Grid</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 10px; }
        
        .header-container { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .profile-img { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #ffd700; }
        
        .main-container { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 12px; max-width: 450px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .address { font-family: monospace; font-size: 11px; background: #eee; padding: 8px; border-radius: 4px; word-break: break-all; margin: 10px 0; }
        
        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; margin-top: 20px; }
        .cell { border: 1px solid #ccc; background: #f9f9f9; padding: 5px 0; font-size: 9px; min-height: 20px; display: flex; align-items: center; justify-content: center; }
        .taken { background: #000; color: #fff; font-weight: bold; }
        
        h2 { margin: 5px 0; }
        ul { text-align: left; display: inline-block; padding-left: 20px; }
    </style>
</head>
<body>

    <div class="header-container">
        <img src="eagle-pi.jpg" alt="Logo" class="profile-img">
        <h1>TALON Grid</h1>
        <img src="eagle-pi.jpg" alt="Logo" class="profile-img">
    </div>
    
    <div class="main-container">
        <p><strong>Cost:</strong> 2€ in ETH per cell</p>
        <p><strong>Official Address:</strong></p>
        <p class="address">0x872bD846596Cc1aEde8Fd800997d242e3473fA83</p>
        
        <hr>
        <h3>Prizes:</h3>
        <ul>
            <li>1st: 10,000 TALON</li>
            <li>2nd: 5,000 TALON</li>
            <li>3rd: 2,000 TALON</li>
        </ul>
        <p><small>Winners drawn once the grid is full!</small></p>

        <div id="grid" class="grid"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const occupants = { 1: "A", 12: "B" }; // Simplifié pour gagner de la place

        for (let i = 1; i <= 100; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell' + (occupants[i] ? ' taken' : '');
            cell.innerText = occupants[i] || i;
            grid.appendChild(cell);
        }
    </script>
</body>
</html>
